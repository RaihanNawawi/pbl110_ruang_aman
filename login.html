<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <script
    type="module"
    src="assets/js/layout.js"
  ></script>
</head>

<body>
  <!-- Navbar reusable -->
  <div id="app-navbar"></div>

  <!-- Main Content -->
<main class="login-container">

    <section class="login-card login-card-wide">

        <div class="text-center mb-4">

            <div class="login-icon">
                <i class="fa-solid fa-shield-heart"></i>
            </div>

            <h1 class="login-title">
                Masuk ke RuangAman
            </h1>

            <p class="login-description mb-0">
                Pilih akses sesuai kebutuhan Anda untuk
                melanjutkan ke portal masing-masing.
            </p>

        </div>

        <div class="row g-3">

            <!-- Pelapor -->
            <div class="col-12 col-md-6 col-lg-4">

                <a href="login-pelapor.html" class="role-card">

                    <div class="role-icon">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <div>
                        <h2 class="role-name">Pelapor</h2>

                        <p class="role-description">
                            Buat laporan dan pantau perkembangan
                            laporan Anda.
                        </p>
                    </div>

                    <i class="fa-solid fa-chevron-right role-arrow"></i>

                </a>

            </div>

            <!-- Satgas -->
            <div class="col-12 col-md-6 col-lg-4">

                <a href="login-satgas.html" class="role-card">

                    <div class="role-icon role-icon-green">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>

                    <div>
                        <h2 class="role-name">Satgas PPKS</h2>

                        <p class="role-description">
                            Tangani laporan yang ditugaskan
                            kepada Anda.
                        </p>
                    </div>

                    <i class="fa-solid fa-chevron-right role-arrow"></i>

                </a>

            </div>

            <!-- Administrator -->
            <div class="col-12 col-md-6 col-lg-4">

                <a href="login-admin.html" class="role-card">

                    <div class="role-icon role-icon-purple">
                        <i class="fa-solid fa-gear"></i>
                    </div>

                    <div>
                        <h2 class="role-name">Administrator</h2>

                        <p class="role-description">
                            Kelola laporan, Satgas, dan
                            pengaturan sistem.
                        </p>
                    </div>

                    <i class="fa-solid fa-chevron-right role-arrow"></i>

                </a>

            </div>

        </div>

        <div class="text-center mt-4">

            <a href="index.html" class="small text-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i>
                Kembali ke Beranda
            </a>

        </div>

    </section>

</main>

  <!-- Footer reusable -->
  <div id="app-footer"></div>
</body>
</html>
