<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script
    type="module"
    src="assets/js/layout.js"
  ></script>
</head>

<body>
  <!-- Navbar reusable -->
  <div id="app-navbar"></div>

  <!-- Main Content -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-9">

        <section class="card border-0 shadow-sm">
          <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

              <div class="d-inline-flex rounded-circle bg-primary-subtle text-primary p-3 mb-3">
                <i class="fa-solid fa-shield-heart fa-fw fs-3"></i>
              </div>

              <h1 class="h3 fw-bold mb-2">
                Masuk ke RuangAman
              </h1>

              <p class="text-body-secondary mb-0">
                Pilih akses sesuai kebutuhan Anda untuk
                melanjutkan ke portal masing-masing.
              </p>

            </div>

            <div class="row g-3">

              <!-- Pelapor -->
              <div class="col-12 col-md-6 col-lg-4">

                <div class="list-group h-100">
                  <a href="login-pelapor.html"
                     class="list-group-item list-group-item-action flex-grow-1 d-flex align-items-center gap-3 p-3">

                    <div class="d-inline-flex rounded-3 p-3 bg-primary-subtle text-primary flex-shrink-0">
                      <i class="fa-solid fa-user fa-fw fs-4"></i>
                    </div>

                    <div>
                      <h2 class="h6 fw-bold mb-1">Pelapor</h2>

                      <p class="small text-body-secondary mb-0">
                        Buat laporan dan pantau perkembangan
                        laporan Anda.
                      </p>
                    </div>

                    <i class="fa-solid fa-chevron-right text-body-secondary small ms-auto flex-shrink-0"></i>

                  </a>
                </div>

              </div>

              <!-- Satgas -->
              <div class="col-12 col-md-6 col-lg-4">

                <div class="list-group h-100">
                  <a href="login-satgas.html"
                     class="list-group-item list-group-item-action flex-grow-1 d-flex align-items-center gap-3 p-3">

                    <div class="d-inline-flex rounded-3 p-3 bg-success-subtle text-success flex-shrink-0">
                      <i class="fa-solid fa-shield-halved fa-fw fs-4"></i>
                    </div>

                    <div>
                      <h2 class="h6 fw-bold mb-1">Satgas PPKS</h2>

                      <p class="small text-body-secondary mb-0">
                        Tangani laporan yang ditugaskan
                        kepada Anda.
                      </p>
                    </div>

                    <i class="fa-solid fa-chevron-right text-body-secondary small ms-auto flex-shrink-0"></i>

                  </a>
                </div>

              </div>

              <!-- Administrator -->
              <div class="col-12 col-md-6 col-lg-4">

                <div class="list-group h-100">
                  <a href="login-admin.html"
                     class="list-group-item list-group-item-action flex-grow-1 d-flex align-items-center gap-3 p-3">

                    <div class="d-inline-flex rounded-3 p-3 bg-info-subtle text-info-emphasis flex-shrink-0">
                      <i class="fa-solid fa-gear fa-fw fs-4"></i>
                    </div>

                    <div>
                      <h2 class="h6 fw-bold mb-1">Administrator</h2>

                      <p class="small text-body-secondary mb-0">
                        Kelola laporan, Satgas, dan
                        pengaturan sistem.
                      </p>
                    </div>

                    <i class="fa-solid fa-chevron-right text-body-secondary small ms-auto flex-shrink-0"></i>

                  </a>
                </div>

              </div>

            </div>

            <div class="text-center mt-4">

              <a href="index.html" class="small text-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i>
                Kembali ke Beranda
              </a>

            </div>

          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- Footer reusable -->
  <div id="app-footer"></div>
</body>
</html>
