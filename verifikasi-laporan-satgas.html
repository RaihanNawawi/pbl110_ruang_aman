<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script
    type="module"
    src="assets/js/layout.js"
  ></script>
</head>

<body>
  <!-- Navbar reusable -->
  <div id="app-navbar"></div>

  <!-- Main Content -->
  <main class="container py-4">

    <nav class="nav nav-pills gap-2 mb-4" aria-label="Navigasi Satgas PPKS">
      <a class="nav-link" href="dashboard-satgas.html">
        <i class="fa-solid fa-gauge-high me-1" aria-hidden="true"></i>
        Dashboard
      </a>
    </nav>

    <!-- Header -->
    <section class="mb-4">

      <a href="detail-laporan-satgas.html"
         class="small text-secondary text-decoration-none d-inline-block mb-3">

        <i class="fa-solid fa-arrow-left me-1"></i>
        Kembali ke Detail Laporan

      </a>

      <h1 class="h3 fw-bold">
        Verifikasi Laporan
      </h1>

      <p class="text-body-secondary mb-0">
        Periksa kelengkapan informasi dan dokumentasikan
        hasil pemeriksaan laporan.
      </p>

    </section>

    <!-- Identitas Laporan -->
    <section class="card border-0 shadow-sm mb-4">
      <div class="card-body p-4">

        <div class="d-flex flex-column flex-md-row
                    justify-content-between gap-3">

          <div>

            <div class="small text-body-secondary mb-2">
              Nomor Tiket
            </div>

            <h2 class="fs-5 fw-bold mb-2">
              RA-20260928-7F3K9
            </h2>

            <span class="badge rounded-pill text-bg-warning">
              Menunggu Verifikasi
            </span>

          </div>

          <div>

            <div class="small text-body-secondary mb-2">
              Kategori Kasus
            </div>

            <div class="fw-semibold">
              Verbal
            </div>

          </div>

        </div>

      </div>
    </section>

    <div class="row g-4">

      <!-- Checklist Verifikasi -->
      <div class="col-12 col-lg-7">

        <section class="card border-0 shadow-sm">
          <div class="card-body p-4">

            <h2 class="h5 fw-bold">
              Checklist Verifikasi
            </h2>

            <p class="text-body-secondary">
              Tandai setiap aspek yang telah diperiksa.
            </p>

            <form action="hasil-verifikasi-laporan-satgas.html" method="get">

              <div class="list-group">

                <label class="list-group-item d-flex gap-3">

                  <input
                    class="form-check-input flex-shrink-0"
                    type="checkbox"
                    id="check-informasi"
                    name="checks[]"
                    value="informasi"
                    required
                  >

                  <span>

                    <strong>Informasi laporan lengkap</strong>

                    <span class="d-block small text-body-secondary">
                      Kategori, tanggal, lokasi, dan kronologi
                      telah diperiksa.
                    </span>

                  </span>

                </label>

                <label class="list-group-item d-flex gap-3">

                  <input
                    class="form-check-input flex-shrink-0"
                    type="checkbox"
                    id="check-bukti"
                    name="checks[]"
                    value="bukti"
                    required
                  >

                  <span>

                    <strong>Bukti pendukung telah diperiksa</strong>

                    <span class="d-block small text-body-secondary">
                      Lampiran dapat diakses dan sesuai dengan
                      informasi yang disampaikan.
                    </span>

                  </span>

                </label>

                <label class="list-group-item d-flex gap-3">

                  <input
                    class="form-check-input flex-shrink-0"
                    type="checkbox"
                    id="check-kronologi"
                    name="checks[]"
                    value="kronologi"
                    required
                  >

                  <span>

                    <strong>Konsistensi keterangan diperiksa</strong>

                    <span class="d-block small text-body-secondary">
                      Kronologi telah ditinjau untuk menentukan
                      apakah diperlukan klarifikasi tambahan.
                    </span>

                  </span>

                </label>

              </div>

              <hr class="my-4">

              <div class="mb-4">

                <label for="hasil"
                       class="form-label fw-bold small">

                  Hasil Verifikasi
                  <span class="text-danger">*</span>

                </label>

                <select class="form-select"
                        id="hasil"
                        name="hasil"
                        required>

                  <option value="">
                    Pilih hasil verifikasi
                  </option>

                  <option value="verified">
                    Informasi cukup — siap ditindaklanjuti
                  </option>

                  <option value="clarification">
                    Memerlukan informasi tambahan
                  </option>

                </select>

              </div>

              <div class="mb-4">

                <label for="catatan-verifikasi"
                       class="form-label fw-bold small">

                  Catatan Verifikasi
                  <span class="text-danger">*</span>

                </label>

                <textarea
                  class="form-control"
                  id="catatan-verifikasi"
                  name="catatan"
                  rows="5"
                  maxlength="500"
                  placeholder="Tuliskan hasil pemeriksaan atau informasi yang perlu diklarifikasi..."
                  required
                ></textarea>

                <div class="form-text">
                  Maksimal 500 karakter.
                </div>

              </div>

              <button type="submit"
                      class="btn btn-primary w-100 py-2">

                <i class="fa-solid fa-check me-2"></i>
                Simpan Hasil Verifikasi

              </button>

            </form>

          </div>
        </section>

      </div>

    </div>

  </main>

  <!-- Footer reusable -->
  <div id="app-footer"></div>
</body>
</html>
