<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk sebagai Satgas PPKS - RuangAman</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script
    type="module"
    src="assets/js/layout.js"
  ></script>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navbar reusable -->
  <div id="app-navbar"></div>

  <!-- Main Content -->
  <main class="container d-flex flex-grow-1 align-items-center justify-content-center py-5">

    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 w-100" style="max-width: 480px;">

        <!-- Header -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle text-white mb-3 shadow-sm" style="width: 64px; height: 64px; background-color: #198754;">
                <i class="fa-solid fa-shield-halved fs-4"></i>
            </div>

            <h1 class="h4 fw-bold text-dark mb-2">
                Masuk sebagai Satgas PPKS
            </h1>

            <p class="text-muted small mb-0 lh-base">
                Gunakan akun Satgas PPKS Anda untuk mengakses dashboard penanganan laporan.
            </p>
        </div>

        <form action="dashboard-satgas.html" method="get">

            <!-- Email -->
            <div class="mb-3">
                <label for="email-satgas" class="form-label small fw-semibold text-dark">
                    Email <span class="text-danger">*</span>
                </label>
                <input
                    type="email"
                    class="form-control bg-light border-0 shadow-none py-2"
                    id="email-satgas"
                    name="email"
                    placeholder="nama@polibatam.ac.id"
                    autocomplete="username"
                    required
                >
            </div>

            <!-- Password -->
            <div class="mb-2">
                <label for="password-satgas" class="form-label small fw-semibold text-dark">
                    Password <span class="text-danger">*</span>
                </label>
                <div class="input-group">
                    <input
                        type="password"
                        class="form-control bg-light border-0 shadow-none py-2 border-end-0"
                        id="password-satgas"
                        name="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >
                    <button
                        type="button"
                        class="btn btn-light bg-light border-0 text-secondary px-3"
                        aria-label="Tampilkan password"
                        aria-pressed="false"
                        onclick="togglePassword('password-satgas', this)"
                    >
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Lupa Password -->
            <div class="text-end mb-4">
                <a href="#" class="small text-primary text-decoration-none">
                    Lupa password?
                </a>
            </div>

            <!-- Tombol Masuk -->
            <button type="submit"
                    class="btn w-100 py-2 text-white fw-semibold d-flex align-items-center justify-content-center gap-2 shadow-sm"
                    style="background-color: #198754;">
                Masuk
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>

        <!-- Divider -->
        <div class="position-relative text-center my-4">
            <hr class="text-secondary opacity-25">
            <span class="position-absolute top-50 start-50 translate-middle px-3 bg-white text-muted small">
                atau
            </span>
        </div>

        <!-- Kembali ke pilihan role -->
        <div class="text-center">
            <a href="login.html" class="small text-secondary text-decoration-none">
                <i class="fa-solid fa-arrow-left me-1"></i>
                Kembali ke Pilihan Role
            </a>
        </div>

    </div>

  </main>

  <script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector('i');

        const isPassword = input.type === 'password';

        input.type = isPassword ? 'text' : 'password';

        icon.classList.toggle('fa-eye', !isPassword);
        icon.classList.toggle('fa-eye-slash', isPassword);

        button.setAttribute('aria-pressed', String(isPassword));

        button.setAttribute(
            'aria-label',
            isPassword ? 'Sembunyikan password' : 'Tampilkan password'
        );
    }
  </script>

  <!-- Footer reusable -->
  <div id="app-footer"></div>
</body>
</html>
