<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script
    type="module"
    src="assets/js/layout.js"
  ></script>
</head>

<body>
  <!-- Navbar reusable -->
  <div id="app-navbar"></div>

  <!-- Konten khusus Beranda -->
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">

        <h1 class="h3 fw-bold mb-1">Buat Laporan Kekerasan</h1>

        <p class="text-body-secondary mb-4">
          Ceritakan kejadian yang ingin Anda laporkan.
        </p>

        <!-- Stepper -->
        <ol class="nav nav-pills nav-fill gap-2 mb-4 small text-center" aria-label="Tahapan pelaporan">
          <li class="nav-item">
            <a class="nav-link h-100 bg-success-subtle text-success-emphasis d-flex flex-column flex-sm-row align-items-center justify-content-center gap-1 gap-sm-2 px-1 px-sm-2" href="data-diri.html">
              <span class="badge rounded-pill text-bg-success"><i class="fa-solid fa-check" aria-hidden="true"></i></span><span>Data Diri</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link h-100 active d-flex flex-column flex-sm-row align-items-center justify-content-center gap-1 gap-sm-2 px-1 px-sm-2" href="detail-kejadian.html" aria-current="step">
              <span class="badge rounded-pill bg-white text-primary">2</span><span>Detail Kejadian</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link h-100 bg-body-tertiary text-body d-flex flex-column flex-sm-row align-items-center justify-content-center gap-1 gap-sm-2 px-1 px-sm-2" href="pelaku-bukti.html">
              <span class="badge rounded-pill text-bg-light">3</span><span>Pelaku &amp; Bukti</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link h-100 bg-body-tertiary text-body d-flex flex-column flex-sm-row align-items-center justify-content-center gap-1 gap-sm-2 px-1 px-sm-2" href="konfirmasi.html">
              <span class="badge rounded-pill text-bg-light">4</span><span>Konfirmasi</span>
            </a>
          </li>
        </ol>

        <form action="pelaku-bukti.html" method="get">

          <section class="card border-0 shadow-sm">
            <div class="card-body p-4">

              <h2 class="h5 fw-bold mb-1">Detail Kejadian</h2>

              <p class="form-text mb-4">
                Jelaskan informasi mengenai kejadian yang Anda laporkan.
              </p>

              <!-- Kategori -->
              <fieldset class="mb-4 border-0 p-0">

                <legend class="form-label">
                  Kategori Kasus <span class="text-danger">*</span>
                </legend>

                <div class="row g-2">

                  <div class="col-12 col-md-4">
                    <input
                      type="radio"
                      class="btn-check"
                      name="kategori"
                      id="kategori-verbal"
                      value="verbal"
                      autocomplete="off"
                      required
                    >
                    <label
                      class="btn btn-outline-primary w-100 h-100 d-flex align-items-start gap-3 text-start p-3"
                      for="kategori-verbal"
                    >
                      <i class="fa-solid fa-comment fa-fw fs-4"></i>
                      <span>
                        <span class="fw-semibold d-block">Verbal</span>
                        <span class="small d-block">
                          Cacian, hinaan, ancaman, dan sejenisnya.
                        </span>
                      </span>
                    </label>
                  </div>

                  <div class="col-12 col-md-4">
                    <input
                      type="radio"
                      class="btn-check"
                      name="kategori"
                      id="kategori-nonverbal"
                      value="nonverbal"
                      autocomplete="off"
                    >
                    <label
                      class="btn btn-outline-primary w-100 h-100 d-flex align-items-start gap-3 text-start p-3"
                      for="kategori-nonverbal"
                    >
                      <i class="fa-solid fa-hand fa-fw fs-4"></i>
                      <span>
                        <span class="fw-semibold d-block">Nonverbal</span>
                        <span class="small d-block">
                          Tindakan fisik atau gestur yang tidak pantas.
                        </span>
                      </span>
                    </label>
                  </div>

                  <div class="col-12 col-md-4">
                    <input
                      type="radio"
                      class="btn-check"
                      name="kategori"
                      id="kategori-cyberbullying"
                      value="cyberbullying"
                      autocomplete="off"
                    >
                    <label
                      class="btn btn-outline-primary w-100 h-100 d-flex align-items-start gap-3 text-start p-3"
                      for="kategori-cyberbullying"
                    >
                      <i class="fa-solid fa-laptop fa-fw fs-4"></i>
                      <span>
                        <span class="fw-semibold d-block">Cyberbullying</span>
                        <span class="small d-block">
                          Pelecehan melalui media digital.
                        </span>
                      </span>
                    </label>
                  </div>

                </div>

              </fieldset>

              <div class="row g-3 mb-4">

                <div class="col-12 col-md-6">
                  <label for="tanggal" class="form-label">
                    Tanggal Kejadian <span class="text-danger">*</span>
                  </label>

                  <input
                    type="date"
                    class="form-control"
                    id="tanggal"
                    name="tanggal"
                    required
                  >
                </div>

                <div class="col-12 col-md-6">
                  <label for="lokasi" class="form-label">
                    Lokasi Kejadian <span class="text-danger">*</span>
                  </label>

                  <select
                    class="form-select"
                    id="lokasi"
                    name="lokasi"
                    required
                  >
                    <option value="">Pilih lokasi</option>
                    <option value="ruang-kelas">Ruang Kelas</option>
                    <option value="laboratorium">Laboratorium</option>
                    <option value="perpustakaan">Perpustakaan</option>
                    <option value="kantin">Kantin</option>
                    <option value="toilet">Toilet</option>
                    <option value="area-kampus">Area Kampus Lainnya</option>
                    <option value="online">Media Digital / Online</option>
                    <option value="lainnya">Lokasi Lainnya</option>
                  </select>
                </div>

              </div>

              <div class="mb-3">

                <label for="kronologi" class="form-label">
                  Kronologi Kejadian <span class="text-danger">*</span>
                </label>

                <textarea
                  class="form-control"
                  id="kronologi"
                  name="kronologi"
                  rows="6"
                  maxlength="1000"
                  placeholder="Ceritakan kejadian secara jelas, termasuk waktu, tempat, dan situasi yang terjadi."
                  required
                ></textarea>

                <div class="form-text">
                  Hindari memasukkan informasi yang tidak relevan.
                </div>

              </div>

              <div class="d-flex justify-content-between gap-2 mt-4">

                <a href="data-diri.html" class="btn btn-outline-secondary">
                  <i class="fa-solid fa-arrow-left me-2"></i>
                  Kembali
                </a>

                <button type="submit" class="btn btn-primary">
                  Lanjut ke Pelaku & Bukti
                  <i class="fa-solid fa-arrow-right ms-2"></i>
                </button>

              </div>

            </div>
          </section>

        </form>

      </div>
    </div>
  </main>

  <!-- Footer reusable -->
  <div id="app-footer"></div>
</body>
</html>
