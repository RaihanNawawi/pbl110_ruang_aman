<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script
    type="module"
    src="assets/js/layout.js"
  ></script>
</head>

<body>
  <!-- Navbar reusable -->
  <div id="app-navbar"></div>

  <!-- Main Content -->
  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8 col-xl-7">

        <div class="text-center mb-4">

          <h1 class="h3 fw-bold">
            Lacak Laporan RuangAman
          </h1>

          <p class="text-body-secondary mb-0">
            Pilih cara masuk sesuai jenis pelaporan Anda.
          </p>

        </div>

        <section class="card border-0 shadow-sm">
          <div class="card-body p-4">

            <div class="text-center mb-4">

              <div class="d-inline-flex rounded-circle bg-primary-subtle text-primary p-3 mb-3">

                <i class="fa-solid fa-magnifying-glass-chart fa-fw fs-3" aria-hidden="true"></i>

              </div>

              <h2 class="h5 fw-bold">
                Lacak laporan
              </h2>

              <p class="small text-body-secondary mb-0">
                Gunakan data pada bukti laporan yang Anda terima.
              </p>

            </div>

            <ul class="nav nav-pills nav-fill gap-2 mb-3" id="lookupModes" role="tablist">
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link active"
                  id="anonymous-mode-tab"
                  data-bs-toggle="pill"
                  data-bs-target="#anonymous-mode"
                  type="button"
                  role="tab"
                  aria-controls="anonymous-mode"
                  aria-selected="true"
                >
                  <i class="fa-solid fa-user-secret me-1" aria-hidden="true"></i>
                  Anonim
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link"
                  id="identified-mode-tab"
                  data-bs-toggle="pill"
                  data-bs-target="#identified-mode"
                  type="button"
                  role="tab"
                  aria-controls="identified-mode"
                  aria-selected="false"
                >
                  <i class="fa-solid fa-user me-1" aria-hidden="true"></i>
                  Teridentifikasi
                </button>
              </li>
            </ul>

            <div class="tab-content">
              <div
                class="tab-pane fade show active"
                id="anonymous-mode"
                role="tabpanel"
                aria-labelledby="anonymous-mode-tab"
                tabindex="0"
              >
                <p class="small text-body-secondary mb-3">
                  Masukkan kode tiket dan kode akses.
                </p>

                <form action="detail-laporan.html" method="get">
                  <div class="row g-2">
                    <div class="col-12 col-sm-6">
                      <label for="anonymous-ticket" class="form-label">
                        Kode Tiket <span class="text-danger">*</span>
                      </label>
                      <input
                        type="text"
                        class="form-control"
                        id="anonymous-ticket"
                        name="ticket"
                        placeholder="RA-20260928-7F3K9"
                        required
                      >
                    </div>

                    <div class="col-12 col-sm-6">
                      <label for="anonymous-access-code" class="form-label">
                        Kode Akses Tiket <span class="text-danger">*</span>
                      </label>
                      <input
                        type="password"
                        class="form-control"
                        id="anonymous-access-code"
                        name="access_code"
                        placeholder="Masukkan kode akses"
                        autocomplete="off"
                        required
                      >
                    </div>

                    <div class="col-12">
                      <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="fa-solid fa-magnifying-glass me-2" aria-hidden="true"></i>
                        Lihat Status Laporan
                        <i class="fa-solid fa-arrow-right ms-2" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                </form>
              </div>

              <div
                class="tab-pane fade"
                id="identified-mode"
                role="tabpanel"
                aria-labelledby="identified-mode-tab"
                tabindex="0"
              >
                <p class="small text-body-secondary mb-3">
                  Gunakan email dan kode tiket saat melapor.
                </p>

                <form action="detail-laporan.html" method="get">
                  <div class="row g-2">
                    <div class="col-12 col-sm-6">
                      <label for="identified-email" class="form-label">
                        Email Aktif <span class="text-danger">*</span>
                      </label>
                      <input
                        type="email"
                        class="form-control"
                        id="identified-email"
                        name="email"
                        placeholder="nama@email.com"
                        autocomplete="email"
                        required
                      >
                    </div>

                    <div class="col-12 col-sm-6">
                      <label for="identified-ticket" class="form-label">
                        Kode Tiket <span class="text-danger">*</span>
                      </label>
                      <input
                        type="text"
                        class="form-control"
                        id="identified-ticket"
                        name="ticket"
                        placeholder="RA-20260928-7F3K9"
                        required
                      >
                    </div>

                    <div class="col-12">
                      <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="fa-solid fa-magnifying-glass me-2" aria-hidden="true"></i>
                        Lihat Status Laporan
                        <i class="fa-solid fa-arrow-right ms-2" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>

            <div class="mt-4">
              <div class="d-flex align-items-center gap-3 text-body-secondary small mb-3">
                <hr class="flex-grow-1 m-0">
                <span>atau</span>
                <hr class="flex-grow-1 m-0">
              </div>

              <div class="d-flex align-items-center gap-3 border rounded-3 p-3">
                <div class="d-inline-flex rounded-3 p-3 bg-primary-subtle text-primary flex-shrink-0">
                  <i class="fa-solid fa-qrcode fa-fw fs-4" aria-hidden="true"></i>
                </div>
                <div>
                  <strong class="d-block">Pindai QR pada bukti laporan</strong>
                  <span class="small text-body-secondary">Scan QR untuk langsung membuka status laporan.</span>
                </div>
                <input
                  class="visually-hidden"
                  type="file"
                  id="report-qr"
                  accept="image/*"
                  capture="environment"
                  aria-label="Pilih atau foto QR pada bukti laporan"
                >
              </div>
            </div>

          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- Footer reusable -->
  <div id="app-footer"></div>
</body>
</html>
