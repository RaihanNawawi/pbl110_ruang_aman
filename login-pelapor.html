<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script
    type="module"
    src="assets/js/layout.js"
  ></script>
</head>

<body>
  <!-- Navbar reusable -->
  <div id="app-navbar"></div>

  <!-- Main Content -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">

        <section class="card border-0 shadow-sm">
          <div class="card-body p-4 p-md-5">

            <div class="text-center">

              <div class="d-inline-flex rounded-circle bg-primary-subtle text-primary p-3 mb-3">
                <i class="fa-solid fa-envelope fa-fw fs-3"></i>
              </div>

              <h1 class="h3 fw-bold mb-2">
                Masuk sebagai Pelapor
              </h1>

              <p class="text-body-secondary mb-4">
                Masukkan email yang Anda gunakan saat membuat laporan.
                Kami akan mengirimkan tautan akses ke email Anda.
              </p>

            </div>

            <form action="magic-link.html" method="get">

              <div class="mb-4">

                <label for="email-pelapor" class="form-label">
                  Email <span class="text-danger">*</span>
                </label>

                <input
                  type="email"
                  class="form-control"
                  id="email-pelapor"
                  name="email"
                  placeholder="nama@email.com"
                  autocomplete="email"
                  required
                >

              </div>

              <button
                type="submit"
                class="btn btn-primary w-100 py-2 d-flex align-items-center justify-content-center gap-2"
              >

                <i class="fa-solid fa-paper-plane"></i>
                Kirim Link Akses
                <i class="fa-solid fa-arrow-right"></i>

              </button>

            </form>

            <div class="alert alert-info d-flex gap-2 small mt-4 mb-0">

              <i class="fa-solid fa-circle-info mt-1"></i>

              <div>
                Jika email terdaftar di RuangAman, sistem akan
                mengirimkan tautan akses. Link berlaku selama
                15 menit.
              </div>

            </div>

            <div class="text-center mt-4">

              <a href="login.html" class="small text-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i>
                Kembali ke Pilihan Role
              </a>

            </div>

          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- Footer reusable -->
  <div id="app-footer"></div>
</body>
</html>
