<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script
    type="module"
    src="assets/js/layout.js"
  ></script>
</head>

<body>
  <!-- Navbar reusable -->
  <div id="app-navbar"></div>

  <!-- Main Content -->
<main class="login-container">

    <section class="login-card">

        <div class="text-center">

            <div class="login-icon">
                <i class="fa-solid fa-envelope"></i>
            </div>

            <h1 class="login-title">
                Masuk sebagai Pelapor
            </h1>

            <p class="login-description">
                Masukkan email yang Anda gunakan saat membuat laporan.
                Kami akan mengirimkan tautan akses ke email Anda.
            </p>

        </div>

        <form action="magic-link.html" method="get">

            <div class="mb-4">

                <label for="email-pelapor" class="form-label login-label">
                    Email <span class="text-danger">*</span>
                </label>

                <input
                    type="email"
                    class="form-control login-input"
                    id="email-pelapor"
                    name="email"
                    placeholder="nama@email.com"
                    autocomplete="email"
                    required
                >

            </div>

            <button type="submit" class="login-button">

                <i class="fa-solid fa-paper-plane"></i>
                Kirim Link Akses
                <i class="fa-solid fa-arrow-right"></i>

            </button>

        </form>

        <div class="login-info">

            <i class="fa-solid fa-circle-info"></i>

            <div>
                Jika email terdaftar di RuangAman, sistem akan
                mengirimkan tautan akses. Link berlaku selama
                15 menit.
            </div>

        </div>

        <div class="text-center mt-4">

            <a href="login.html" class="small text-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i>
                Kembali ke Pilihan Role
            </a>

        </div>

    </section>

</main>

  <!-- Footer reusable -->
  <div id="app-footer"></div>
</body>
</html>
